name: Bug report
description: Something in the add-on does not work as described.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not use this form — see
        [SECURITY.md](https://github.com/NorlayOfficial/norlay-link-checker/blob/main/SECURITY.md).

  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      description: NVDA menu, Tools, Add-on Store, Installed add-ons.
      placeholder: "1.1.3"
    validations:
      required: true

  - type: input
    id: nvda-version
    attributes:
      label: NVDA version
      description: NVDA menu, Help, About.
      placeholder: "2026.1"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: clipboard
    attributes:
      label: What was on the clipboard?
      options:
        - A web address
        - Ordinary text that is not a link
        - Copied files or folders
        - A picture or other non-text data
        - Nothing, or I am not sure
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Which Gemini model is selected?
      description: NVDA menu, Preferences, Settings, Norlay Link Checker.
      options:
        - Gemini 3.5 Flash-Lite (default)
        - Gemini 3.8 Flash
        - Gemini 3.6 Flash
        - I have not chosen a key or model yet
        - Not sure
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Quote the exact message NVDA spoke or showed.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: NVDA log
      description: |
        Optional. NVDA menu, Tools, View log, then copy the lines around the error.
        Remove your API key and any address you would rather keep private before pasting.
      render: text
    validations:
      required: false
