[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norlay-link-checker"
version = "1.1.3"
description = "An NVDA add-on that explains the link in your clipboard with your own free Google Gemini key, without opening it."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["COPYING.txt"]
keywords = ["nvda", "nvda-addon", "accessibility", "screen-reader", "clipboard"]
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Environment :: Win32 (MS Windows)",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
	"Natural Language :: English",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3",
	"Topic :: Accessibility",
]

[project.urls]
Homepage = "https://norlay.fit/norlay-link-checker/"
Repository = "https://github.com/NorlayOfficial/norlay-link-checker"
Changelog = "https://github.com/NorlayOfficial/norlay-link-checker/blob/main/changelog.md"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E101", "W191"]

[tool.pytest.ini_options]
testpaths = ["tests"]
